<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karla Acuña — Diseño Gráfico &amp; Arte</title>
<meta name="description" content="Karla Acuña — Diseñadora gráfica y artista multidisciplinaria en Monterrey, México. Branding, identidad visual, tatuaje artístico y arte original.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23CC154A'/%3E%3Ctext x='32' y='45' font-family='Arial, sans-serif' font-weight='800' font-size='36' fill='%23F9F9F9' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,700;0,800;1,700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg: #F9F9F9;
    --color-bg-alt: #F5E1CD;
    --color-surface: #FFFFFF;
    --color-text: #232323;
    --color-text-soft: #4a4a4a;
    --color-primary: #CC154A;
    --color-primary-dark: #8C0C3A;
    --color-light: #F9F9F9;
    --font-heading: 'Poppins', Arial, sans-serif;
    --font-body: 'Roboto', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --radius: 16px;
    --max-width: 1160px;
    --header-h: 72px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; scroll-padding-top: var(--header-h); }
  body{
    margin:0;
    font-family: var(--font-body);
    font-weight: 300;
    color: var(--color-text);
    background: var(--color-bg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  img{ max-width:100%; display:block; }
  a{ color: inherit; text-decoration: none; }
  ul, ol{ padding-left: 1.2em; }
  h1,h2,h3,h4{
    font-family: var(--font-heading);
    font-weight: 800;
    line-height: 1.15;
    margin: 0 0 .5em;
    letter-spacing: -0.01em;
  }
  p{ margin: 0 0 1em; }
  .container{ max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }
  .section{ padding: 72px 0; }
  .section-tight{ padding: 48px 0; }
  .eyebrow{
    font-family: var(--font-heading);
    font-weight: 700;
    font-style: italic;
    color: var(--color-primary);
    text-transform: uppercase;
    letter-spacing: .08em;
    font-size: .8rem;
    margin-bottom: .6em;
    display:block;
  }
  .bg-alt{ background: var(--color-bg-alt); }
  .bg-dark{ background: var(--color-text); color: var(--color-light); }
  .bg-dark h1, .bg-dark h2, .bg-dark h3{ color: var(--color-light); }

  /* Buttons */
  .btn{
    display:inline-flex;
    align-items:center;
    gap:.5em;
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: .95rem;
    padding: 14px 26px;
    border-radius: 999px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn-primary{ background: var(--color-primary); color: var(--color-light); }
  .btn-primary:hover{ background: var(--color-primary-dark); }
  .btn-outline{ background: transparent; color: var(--color-text); border-color: var(--color-text); }
  .bg-dark .btn-outline{ color: var(--color-light); border-color: var(--color-light); }
  .btn-outline:hover{ background: var(--color-text); color: var(--color-light); }
  .bg-dark .btn-outline:hover{ background: var(--color-light); color: var(--color-text); }
  .btn-group{ display:flex; flex-wrap:wrap; gap: 16px; margin-top: 8px; }

  /* Header */
  .site-header{
    position: sticky; top:0; z-index: 100;
    background: var(--color-text);
    height: var(--header-h);
    display:flex; align-items:center;
  }
  .nav-wrap{
    width:100%; max-width: var(--max-width); margin:0 auto; padding: 0 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo-mark{
    position:relative;
    width: 42px; height:42px;
    background: var(--color-primary);
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-heading); font-weight:800; font-size:1.35rem;
    color: var(--color-light);
    flex-shrink:0;
  }
  .logo-mark::after{
    content:'';
    position:absolute; top:7px; right:8px;
    width:7px; height:7px;
    background: var(--color-bg-alt);
    border-radius: 50% 50% 0 50%;
    transform: rotate(45deg);
  }
  .brand-name{ font-family: var(--font-heading); font-weight:700; color: var(--color-light); font-size: 1.05rem; }
  .main-nav{ display:flex; align-items:center; gap: 28px; }
  .nav-links{ display:flex; align-items:center; gap: 26px; list-style:none; margin:0; padding:0; }
  .nav-links a{
    color: var(--color-light); opacity:.85; font-weight:500; font-size:.95rem;
    padding: 6px 2px; border-bottom: 2px solid transparent;
  }
  .nav-links a:hover{ opacity:1; border-color: var(--color-primary); }
  .lang-toggle{
    font-family: var(--font-heading); font-weight:700; font-size:.85rem;
    background: rgba(249,249,249,.08);
    color: var(--color-light);
    border: 1px solid rgba(249,249,249,.35);
    border-radius: 999px;
    padding: 8px 14px;
    cursor:pointer;
    display:flex; align-items:center; gap:4px;
  }
  .lang-toggle span{ padding: 2px 5px; border-radius: 6px; opacity:.55; }
  .lang-toggle span.active{ opacity:1; background: var(--color-primary); }
  .nav-burger{
    display:none; background:none; border:none; color: var(--color-light);
    font-size: 1.5rem; cursor:pointer; padding: 4px 8px;
  }

  @media (max-width: 860px){
    .nav-burger{ display:block; }
    .main-nav{
      position:fixed; top: var(--header-h); left:0; right:0;
      background: var(--color-text);
      flex-direction:column; align-items:flex-start;
      padding: 20px 24px 28px;
      gap: 18px;
      transform: translateY(-8px);
      opacity:0; pointer-events:none;
      transition: opacity .2s ease, transform .2s ease;
      border-bottom: 1px solid rgba(249,249,249,.12);
    }
    .main-nav.open{ opacity:1; pointer-events:auto; transform: translateY(0); }
    .nav-links{ flex-direction:column; align-items:flex-start; gap: 14px; width:100%; }
  }

  /* Hero */
  .hero{ padding: 96px 0 80px; text-align:center; }
  .hero .container{ max-width: 780px; }
  .hero h1{ font-size: clamp(2rem, 4.4vw, 3.1rem); }
  .hero p{ font-size: 1.15rem; color: rgba(249,249,249,.85); max-width: 620px; margin-left:auto; margin-right:auto; }
  .hero .btn-group{ justify-content:center; margin-top: 28px; }

  /* About */
  .about-grid{ display:grid; grid-template-columns: 1fr; gap: 20px; max-width: 720px; margin: 0 auto; }
  .badge-highlight{
    margin-top: 18px;
    display:inline-flex; align-items:center; gap:10px;
    background: var(--color-primary);
    color: var(--color-light);
    font-family: var(--font-heading); font-weight:700; font-size:.95rem;
    padding: 14px 22px; border-radius: 12px;
  }
  .section-center{ text-align:center; }
  .section-center h2{ margin-bottom: .4em; }
  .section-intro{ max-width: 640px; margin: 0 auto 40px; text-align:center; color: var(--color-text-soft); }

  /* Cards (services) */
  .cards-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: 24px; }
  .card{
    background: var(--color-surface);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: 0 2px 18px rgba(35,35,35,.06);
    display:flex; flex-direction:column;
  }
  .card h3{ font-size: 1.25rem; }
  .card p{ color: var(--color-text-soft); flex-grow:1; }
  .card a.btn{ align-self:flex-start; margin-top: 8px; }

  /* CTA */
  .cta{ text-align:center; }
  .cta .container{ max-width: 640px; }
  .cta .btn-group{ justify-content:center; }

  /* Section hero (design/tattoo page intros) */
  .page-section{ }
  .section-hero{ padding: 64px 0 40px; text-align:center; }
  .section-hero .container{ max-width: 700px; }
  .section-hero h1{ font-size: clamp(1.8rem, 3.6vw, 2.6rem); }
  .section-hero p{ color: var(--color-text-soft); font-size: 1.1rem; }

  /* Portfolio */
  .portfolio-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 24px; }
  .project-card{
    background: var(--color-surface);
    border-radius: var(--radius);
    overflow:hidden;
    box-shadow: 0 2px 18px rgba(35,35,35,.06);
    display:flex; flex-direction:column;
  }
  .project-card.featured{ grid-column: span 2; }
  @media (max-width: 700px){ .project-card.featured{ grid-column: span 1; } }
  .project-img-placeholder{
    aspect-ratio: 16/10;
    background: linear-gradient(135deg, var(--color-bg-alt), var(--color-bg));
    display:flex; align-items:center; justify-content:center;
    color: var(--color-text-soft);
    font-size: .85rem; text-align:center; padding: 12px;
    border-bottom: 1px solid rgba(35,35,35,.06);
  }
  .project-card.featured .project-img-placeholder{ background: linear-gradient(135deg, var(--color-primary-dark), var(--color-primary)); color: var(--color-light); aspect-ratio: 16/7; }
  .project-body{ padding: 22px 24px 26px; display:flex; flex-direction:column; gap:8px; flex-grow:1; }
  .project-category{ font-size: .78rem; text-transform:uppercase; letter-spacing:.06em; color: var(--color-primary); font-weight:600; }
  .project-card h3{ font-size: 1.15rem; margin-bottom:2px; }
  .project-card p{ color: var(--color-text-soft); font-size: .95rem; margin-bottom: 6px; }
  .result-badge{
    display:inline-block; align-self:flex-start;
    background: var(--color-bg-alt);
    color: var(--color-primary-dark);
    font-family: var(--font-heading); font-weight:700; font-size:.78rem;
    padding: 6px 12px; border-radius: 999px; margin-top:auto;
  }

  /* Packages */
  .packages-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 24px; align-items:stretch; }
  .package-card{
    background: var(--color-surface);
    border-radius: var(--radius);
    padding: 32px 26px;
    box-shadow: 0 2px 18px rgba(35,35,35,.06);
    display:flex; flex-direction:column;
    border: 2px solid transparent;
    position:relative;
  }
  .package-card.popular{ border-color: var(--color-primary); }
  .popular-tag{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    background: var(--color-primary); color:var(--color-light);
    font-family: var(--font-heading); font-weight:700; font-size:.75rem;
    padding: 6px 16px; border-radius: 999px; white-space:nowrap;
  }
  .package-name{ font-family: var(--font-heading); font-weight:800; color: var(--color-primary-dark); font-size: 1rem; letter-spacing:.05em; text-transform:uppercase; }
  .package-card h3{ font-size: 1.4rem; margin: 4px 0 2px; }
  .package-price{ font-family: var(--font-heading); font-weight:700; font-size: 1.15rem; color: var(--color-text); margin: 10px 0; }
  .package-ideal{ font-size:.92rem; color: var(--color-text-soft); margin-bottom: 14px; }
  .package-includes-label{ font-family: var(--font-heading); font-weight:700; font-size: .85rem; text-transform:uppercase; letter-spacing:.04em; margin-bottom: 8px; }
  .package-includes{ list-style:none; padding:0; margin:0 0 18px; display:flex; flex-direction:column; gap:8px; }
  .package-includes li{ font-size: .92rem; padding-left: 22px; position:relative; color: var(--color-text-soft); }
  .package-includes li::before{ content:'✓'; position:absolute; left:0; color: var(--color-primary); font-weight:700; }
  .package-meta{ margin-top:auto; display:flex; flex-direction:column; gap:4px; font-size:.85rem; color: var(--color-text-soft); border-top: 1px solid rgba(35,35,35,.08); padding-top: 14px; }
  .package-meta b{ color: var(--color-text); }

  /* Addons table */
  .table-wrap{ overflow-x:auto; border-radius: var(--radius); box-shadow: 0 2px 18px rgba(35,35,35,.06); }
  table.addons{ width:100%; border-collapse:collapse; background: var(--color-surface); min-width: 560px; }
  table.addons th, table.addons td{ text-align:left; padding: 14px 18px; border-bottom: 1px solid rgba(35,35,35,.08); font-size:.93rem; }
  table.addons th{ font-family: var(--font-heading); font-weight:700; background: var(--color-text); color: var(--color-light); }
  table.addons tr:last-child td{ border-bottom:none; }
  table.addons td:last-child{ font-weight:600; white-space:nowrap; }

  /* Process steps */
  .steps{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 22px; counter-reset: step; }
  .steps li{ counter-increment: step; background: var(--color-surface); border-radius: var(--radius); padding: 26px 22px; box-shadow: 0 2px 18px rgba(35,35,35,.06); }
  .steps li::before{
    content: counter(step);
    display:flex; align-items:center; justify-content:center;
    width: 34px; height:34px; border-radius:50%;
    background: var(--color-primary); color: var(--color-light);
    font-family: var(--font-heading); font-weight:700; margin-bottom: 14px;
  }
  .steps h3{ font-size: 1.05rem; margin-bottom:6px; }
  .steps p{ color: var(--color-text-soft); font-size: .92rem; margin:0; }

  /* Gallery placeholders */
  .gallery-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 16px; }
  .gallery-slot{
    aspect-ratio: 1/1;
    background: var(--color-bg-alt);
    border-radius: 12px;
    display:flex; align-items:center; justify-content:center;
    color: var(--color-primary-dark); font-size:.8rem; text-align:center; padding:10px;
    overflow:hidden;
  }
  .gallery-slot.has-photo{ padding:0; }
  .gallery-slot.has-photo img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* Trust note */
  .trust-note{
    margin-top: 24px;
    background: var(--color-bg-alt);
    border-left: 4px solid var(--color-primary);
    padding: 18px 22px;
    border-radius: 8px;
    font-weight:500;
    max-width: 640px;
  }

  /* Contact blocks */
  .contact-block{ text-align:center; }
  .contact-block .container{ max-width: 620px; }
  .contact-block .btn-group{ justify-content:center; }
  .contact-info{ list-style:none; padding:0; margin: 22px 0 0; display:flex; flex-wrap:wrap; justify-content:center; gap: 24px; font-size:.9rem; color: var(--color-text-soft); }
  .contact-info b{ color: var(--color-text); }

  /* Footer */
  .site-footer{ background: var(--color-text); color: rgba(249,249,249,.85); padding: 48px 0 28px; }
  .footer-grid{ display:flex; flex-wrap:wrap; justify-content:space-between; gap: 24px; }
  .footer-name{ font-family: var(--font-heading); font-weight:700; color: var(--color-light); font-size:1.1rem; }
  .footer-links{ list-style:none; padding:0; margin: 10px 0 0; display:flex; flex-direction:column; gap:6px; font-size:.92rem; }
  .footer-note{ margin-top: 32px; padding-top: 20px; border-top: 1px solid rgba(249,249,249,.15); font-size: .82rem; opacity:.65; text-align:center; }

  .divider{ height:1px; background: rgba(35,35,35,.08); }
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="#home">
      <span class="logo-mark">K</span>
      <span class="brand-name">Karla Acuña</span>
    </a>
    <div class="main-nav" id="mainNav">
      <ul class="nav-links">
        <li><a href="#home" data-nav="home"></a></li>
        <li><a href="#diseno" data-nav="diseno"></a></li>
        <li><a href="#tattoo" data-nav="tattoo"></a></li>
        <li><a id="navArte" href="#" target="_blank" rel="noopener" data-nav="arte"></a></li>
        <li><a href="#contacto" data-nav="contacto"></a></li>
      </ul>
      <button class="lang-toggle" id="langToggle" aria-pressed="false" aria-label="Switch language / Cambiar idioma">
        <span id="langEs">ES</span> / <span id="langEn">EN</span>
      </button>
    </div>
    <button class="nav-burger" id="navBurger" aria-label="Abrir menú">☰</button>
  </div>
</header>

<main>

  <!-- HOME / HERO -->
  <section id="home" class="hero bg-dark">
    <div class="container">
      <h1 id="heroTitle"></h1>
      <p id="heroSubtitle"></p>
      <div class="btn-group">
        <a href="#diseno" class="btn btn-primary" id="heroBtn1"></a>
        <a href="#tattoo" class="btn btn-outline" id="heroBtn2"></a>
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="sobre-mi" class="section">
    <div class="container about-grid">
      <div class="section-center">
        <h2 id="aboutHeading"></h2>
      </div>
      <p id="aboutP1"></p>
      <p id="aboutP2"></p>
      <p id="aboutP3"></p>
      <div style="text-align:center;">
        <span class="badge-highlight" id="aboutBadge"></span>
      </div>
    </div>
  </section>

  <!-- SERVICE CARDS -->
  <section id="servicios" class="section bg-alt">
    <div class="container">
      <div class="cards-grid" id="cardsGrid"></div>
    </div>
  </section>

  <!-- HOME CTA / CONTACT -->
  <section id="contacto" class="section cta">
    <div class="container">
      <h2 id="ctaHeading"></h2>
      <p id="ctaText"></p>
      <div class="btn-group">
        <a href="#" class="btn btn-primary" id="ctaBtnWa" target="_blank" rel="noopener"></a>
        <a href="#" class="btn btn-outline" id="ctaBtnMail"></a>
      </div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- DISEÑO -->
  <section id="diseno" class="page-section">
    <div class="section-hero">
      <div class="container">
        <h1 id="disenoTitle"></h1>
        <p id="disenoSubtitle"></p>
      </div>
    </div>

    <div class="section">
      <div class="container">
        <div class="section-center">
          <h2 id="portfolioHeading"></h2>
        </div>
        <p class="section-intro" id="portfolioIntro"></p>
        <div class="portfolio-grid" id="portfolioGrid"></div>
      </div>
    </div>

    <div class="section bg-alt">
      <div class="container">
        <div class="section-center">
          <h2 id="packagesHeading"></h2>
        </div>
        <p class="section-intro" id="packagesIntro"></p>
        <div class="packages-grid" id="packagesGrid"></div>
      </div>
    </div>

    <div class="section">
      <div class="container">
        <div class="section-center">
          <h2 id="addonsHeading"></h2>
        </div>
        <p class="section-intro" id="addonsIntro"></p>
        <div class="table-wrap">
          <table class="addons">
            <thead><tr id="addonsHeadRow"></tr></thead>
            <tbody id="addonsBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="section bg-alt">
      <div class="container">
        <div class="section-center">
          <h2 id="processHeading"></h2>
        </div>
        <ol class="steps" id="processList"></ol>
      </div>
    </div>

    <div class="section contact-block">
      <div class="container">
        <h2 id="disenoContactHeading"></h2>
        <p id="disenoContactText"></p>
        <div class="btn-group">
          <a href="#" class="btn btn-primary" id="disenoBtnWa" target="_blank" rel="noopener"></a>
          <a href="#" class="btn btn-outline" id="disenoBtnMail"></a>
        </div>
      </div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- TATTOO -->
  <section id="tattoo" class="page-section bg-alt">
    <div class="section-hero">
      <div class="container">
        <h1 id="tattooTitle"></h1>
        <p id="tattooSubtitle"></p>
      </div>
    </div>

    <div class="section" style="padding-top:0;">
      <div class="container" style="max-width:760px;">
        <h2 id="approachHeading"></h2>
        <p id="approachP1"></p>
        <p id="approachP2"></p>
      </div>
    </div>

    <div class="section">
      <div class="container">
        <div class="section-center">
          <h2 id="galleryHeading"></h2>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
    </div>

    <div class="section">
      <div class="container">
        <div class="section-center">
          <h2 id="howHeading"></h2>
        </div>
        <p class="section-intro" id="howIntro"></p>
        <ol class="steps" id="howList"></ol>
        <div style="text-align:center;">
          <p class="trust-note" id="trustNote" style="margin-left:auto;margin-right:auto;"></p>
        </div>
      </div>
    </div>

    <div class="section contact-block">
      <div class="container">
        <h2 id="tattooContactHeading"></h2>
        <p id="tattooContactText"></p>
        <div class="btn-group">
          <a href="#" class="btn btn-primary" id="tattooBtnWa" target="_blank" rel="noopener"></a>
        </div>
        <ul class="contact-info" id="tattooInfo"></ul>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <div class="footer-name" id="footerName"></div>
      <ul class="footer-links">
        <li id="footerEmail"></li>
        <li id="footerWhatsapp"></li>
        <li id="footerInstagram"></li>
        <li id="footerLocation"></li>
      </ul>
    </div>
  </div>
  <div class="container">
    <div class="footer-note" id="footerNote"></div>
  </div>
</footer>

<script>
(function(){

    document.querySelectorAll('[data-nav]').forEach(function(a){
      var key = a.getAttribute('data-nav');
      a.textContent = DATA.nav[key][lang];
    });
    document.getElementById('navArte').href = CONFIG.etsyUrl;
  }

  function renderHero(lang){
    setText('heroTitle', DATA.hero.title[lang]);
    setText('heroSubtitle', DATA.hero.subtitle[lang]);
    setText('heroBtn1', DATA.hero.btn1[lang]);
    setText('heroBtn2', DATA.hero.btn2[lang]);
  }

  function renderAbout(lang){
    setText('aboutHeading', DATA.about.heading[lang]);
    setText('aboutP1', DATA.about.p1[lang]);
    setText('aboutP2', DATA.about.p2[lang]);
    setText('aboutP3', DATA.about.p3[lang]);
    setText('aboutBadge', DATA.about.badge[lang]);
  }

  function renderCards(lang){
    var grid = document.getElementById('cardsGrid');
    grid.innerHTML = DATA.cards.map(function(c){
      var attrs = c.external ? ' target="_blank" rel="noopener"' : '';
      return '<article class="card">' +
        '<h3>' + c.title[lang] + '</h3>' +
        '<p>' + c.text[lang] + '</p>' +
        '<a class="btn btn-primary" href="' + c.href + '"' + attrs + '>' + c.btn[lang] + '</a>' +
        '</article>';
    }).join('');
  }

  function renderCta(lang){
    setText('ctaHeading', DATA.cta.heading[lang]);
    setText('ctaText', DATA.cta.text[lang]);
    setText('ctaBtnWa', DATA.cta.btnWa[lang]);
    document.getElementById('ctaBtnWa').href = wa(DATA.cta.waMessage[lang]);
    setText('ctaBtnMail', DATA.cta.btnMail[lang]);
    document.getElementById('ctaBtnMail').href = mailto();
  }

  function renderFooter(lang){
    setText('footerName', DATA.footer.name[lang]);
    setText('footerEmail', '<b>' + DATA.footer.emailLabel[lang] + ':</b> ' + CONFIG.email);
    setText('footerWhatsapp', '<b>' + DATA.footer.whatsappLabel[lang] + ':</b> ' + CONFIG.whatsappNumber);
    setText('footerInstagram', '<b>' + DATA.footer.instagramLabel[lang] + ':</b> @' + CONFIG.instagramHandle);
    setText('footerLocation', '<b>' + DATA.footer.locationLabel[lang] + ':</b> ' + DATA.footer.locationValue[lang]);
    setText('footerNote', DATA.footer.note[lang]);
  }

  function renderDisenoHero(lang){
    setText('disenoTitle', DATA.diseno.title[lang]);
    setText('disenoSubtitle', DATA.diseno.subtitle[lang]);
  }

  function renderPortfolio(lang){
    setText('portfolioHeading', DATA.diseno.portfolioHeading[lang]);
    setText('portfolioIntro', DATA.diseno.portfolioIntro[lang]);
    var grid = document.getElementById('portfolioGrid');
    grid.innerHTML = DATA.projects.map(function(p){
      var eyebrow = p.featured ? '<span class="eyebrow">' + p.eyebrow[lang] + '</span>' : '';
      var badge = p.badge ? '<span class="result-badge">' + p.badge[lang] + '</span>' : '';
      return '<article class="project-card' + (p.featured ? ' featured' : '') + '">' +
        '<div class="project-img-placeholder">' + p.imgPlaceholder[lang] + '</div>' +
        '<div class="project-body">' +
          eyebrow +
          '<span class="project-category">' + p.category[lang] + '</span>' +
          '<h3>' + p.title[lang] + '</h3>' +
          '<p>' + p.desc[lang] + '</p>' +
          badge +
        '</div>' +
      '</article>';
    }).join('');
  }

  function renderPackages(lang){
    setText('packagesHeading', DATA.diseno.packagesHeading[lang]);
    setText('packagesIntro', DATA.diseno.packagesIntro[lang]);
    var grid = document.getElementById('packagesGrid');
    grid.innerHTML = DATA.packages.map(function(pkg){
      var tag = pkg.popular ? '<span class="popular-tag">' + DATA.diseno.popularTag[lang] + '</span>' : '';
      var includes = pkg.includes[lang].map(function(i){ return '<li>' + i + '</li>'; }).join('');
      return '<div class="package-card' + (pkg.popular ? ' popular' : '') + '">' +
        tag +
        '<div class="package-name">' + pkg.name[lang] + '</div>' +
        '<h3>' + pkg.subtitle[lang] + '</h3>' +
        '<div class="package-price">' + pkg.price + '</div>' +
        '<div class="package-ideal"><b>' + DATA.diseno.idealForLabel[lang] + ':</b> ' + pkg.idealFor[lang] + '</div>' +
        '<div class="package-includes-label">' + DATA.diseno.includesLabel[lang] + '</div>' +
        '<ul class="package-includes">' + includes + '</ul>' +
        '<div class="package-meta">' +
          '<div><b>' + DATA.diseno.revisionsLabel[lang] + ':</b> ' + pkg.revisions[lang] + '</div>' +
          '<div><b>' + DATA.diseno.deliveryLabel[lang] + ':</b> ' + pkg.delivery[lang] + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderAddons(lang){
    setText('addonsHeading', DATA.diseno.addonsHeading[lang]);
    setText('addonsIntro', DATA.diseno.addonsIntro[lang]);
    var headRow = document.getElementById('addonsHeadRow');
    headRow.innerHTML = DATA.diseno.addonsHead.map(function(h){ return '<th>' + h[lang] + '</th>'; }).join('');
    var body = document.getElementById('addonsBody');
    body.innerHTML = DATA.addons.map(function(row){
      return '<tr><td>' + row.service[lang] + '</td><td>' + row.includes[lang] + '</td><td>' + row.range + '</td></tr>';
    }).join('');
  }

  function renderProcess(lang){
    setText('processHeading', DATA.diseno.processHeading[lang]);
    var list = document.getElementById('processList');
    list.innerHTML = DATA.process.map(function(s){
      return '<li><h3>' + s.title[lang] + '</h3><p>' + s.desc[lang] + '</p></li>';
    }).join('');
  }

  function renderDisenoContact(lang){
    setText('disenoContactHeading', DATA.diseno.contactHeading[lang]);
    setText('disenoContactText', DATA.diseno.contactText[lang]);
    setText('disenoBtnWa', DATA.diseno.btnWa[lang]);
    document.getElementById('disenoBtnWa').href = wa(DATA.diseno.waMessage[lang]);
    setText('disenoBtnMail', DATA.diseno.btnMail[lang]);
    document.getElementById('disenoBtnMail').href = mailto();
  }

  function renderTattoo(lang){
    setText('tattooTitle', DATA.tattoo.title[lang]);
    setText('tattooSubtitle', DATA.tattoo.subtitle[lang]);
    setText('approachHeading', DATA.tattoo.approachHeading[lang]);
    setText('approachP1', DATA.tattoo.approachP1[lang]);
    setText('approachP2', DATA.tattoo.approachP2[lang]);
    setText('galleryHeading', DATA.tattoo.galleryHeading[lang]);

    var gallery = document.getElementById('galleryGrid');
    var slots = DATA.tattooPhotos.map(function(src){
      return '<div class="gallery-slot has-photo"><img src="' + src + '" alt="' + DATA.tattoo.galleryAlt[lang] + '" loading="lazy"></div>';
    }).join('');
    for(var i=0;i<3;i++){
      slots += '<div class="gallery-slot">' + DATA.tattoo.gallerySlot[lang] + '</div>';
    }
    gallery.innerHTML = slots;

    setText('howHeading', DATA.tattoo.howHeading[lang]);
    setText('howIntro', DATA.tattoo.howIntro[lang]);
    var howList = document.getElementById('howList');
    howList.innerHTML = DATA.howSteps.map(function(s){
      return '<li><h3>' + s.title[lang] + '</h3><p>' + s.desc[lang] + '</p></li>';
    }).join('');
    setText('trustNote', DATA.tattoo.trustNote[lang]);

    setText('tattooContactHeading', DATA.tattoo.contactHeading[lang]);
    setText('tattooContactText', DATA.tattoo.contactText[lang]);
    setText('tattooBtnWa', DATA.tattoo.btnWa[lang]);
    document.getElementById('tattooBtnWa').href = wa(DATA.tattoo.waMessage[lang]);

    var info = document.getElementById('tattooInfo');
    info.innerHTML =
      '<li><b>' + DATA.tattoo.locationLabel[lang] + ':</b> ' + DATA.tattoo.locationValue[lang] + '</li>' +
      '<li><b>' + DATA.tattoo.responseLabel[lang] + ':</b> ' + DATA.tattoo.responseValue[lang] + '</li>';
  }

  function renderAll(lang){
    document.documentElement.lang = lang;
    document.getElementById('langToggle').setAttribute('aria-pressed', lang === 'en');
    renderNav(lang);
    renderHero(lang);
    renderAbout(lang);
    renderCards(lang);
    renderCta(lang);
    renderFooter(lang);
    renderDisenoHero(lang);
    renderPortfolio(lang);
    renderPackages(lang);
    renderAddons(lang);
    renderProcess(lang);
    renderDisenoContact(lang);
    renderTattoo(lang);
  }

  document.getElementById('langToggle').addEventListener('click', function(){
    currentLang = currentLang === 'es' ? 'en' : 'es';
    renderAll(currentLang);
  });

  var navBurger = document.getElementById('navBurger');
  var mainNav = document.getElementById('mainNav');
  navBurger.addEventListener('click', function(){
    mainNav.classList.toggle('open');
  });
  document.querySelectorAll('#mainNav a').forEach(function(a){
    a.addEventListener('click', function(){ mainNav.classList.remove('open'); });
  });

  renderAll(currentLang);

})();
</script>

</body>
</html>
